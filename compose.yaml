services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tsfm:${POSTGRES_PASSWORD}@db:5432/tsfm
      NEO4J_URI: bolt://graph:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MODEL_PATH: /app/artifacts/traffic_model.joblib
      DATA_PATH: /app/data/metro_hourly.csv
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "127.0.0.1:${APP_PORT:-27831}:8000"
    depends_on:
      db:
        condition: service_healthy
      graph:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tsfm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tsfm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsfm -d tsfm"]
      interval: 5s
      retries: 20
  graph:
    image: neo4j:5.26.0
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:7474:7474"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      retries: 30
volumes:
  postgres_data:
  neo4j_data:

